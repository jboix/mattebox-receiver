name: 🐛 Bug Report
description: Report a possible bug or regression
title: "🐛 <TITLE>"
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug. Please provide a clear and concise
        description of what the bug is; reports that cannot be reproduced
        take much longer to fix.
  - type: textarea
    id: environment
    attributes:
      label: Environment information
      description: >
        Paste the versions of @mattebox/cast-receiver, @mattebox/player and
        mattebox. For a bug on a device, state the device generation and the
        runtime version (the receiver's user agent, from the debug overlay).
        If the bug involves a stream, state the source URL or its kind (HLS,
        DASH, progressive) and whether it is VOD or live. Review the output
        for anything sensitive before posting.
      value: |
        <details>

        ```
        Paste output here
        ```

        </details>
    validations:
      required: true
  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: What happened?
      description: >
        Provide the steps that reproduce the issue, including the handler
        list or the element's attributes and, if possible, a source or a
        minimal snippet that triggers it. The more complete the steps, the
        quicker the report can be triaged and addressed.
      placeholder: |
        1.
        2.
    validations:
      required: true
  - type: textarea
    id: expected-result
    attributes:
      label: Expected result
      description: Describe what you expected to happen.
      placeholder: The quality menu should list every rendition.
    validations:
      required: true
  - type: checkboxes
    id: coc
    attributes:
      label: Code of Conduct
      description: By submitting this issue, you agree to follow our [Code of Conduct](https://github.com/jboix/mattebox-receiver/blob/main/docs/CODE_OF_CONDUCT.md)
      options:
        - label: I agree to follow the Mattebox Cast receiver's Code of Conduct
          required: true
