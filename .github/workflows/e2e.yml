name: E2E

# The app's page in three real browsers. The Quality workflow runs this suite
# on every pull request; this run repeats it nightly against main and on
# demand from the Actions tab, so a browser or runner change surfaces without
# waiting for a change here. `npm run test:e2e` runs it locally.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * *'

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js environment
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - name: Install dependencies
        env:
          HUSKY: '0'
        run: npm ci
      - name: Install browsers
        uses: ./.github/actions/playwright-browsers
      - name: App page E2E
        run: npm run test:e2e
