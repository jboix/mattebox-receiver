name: Quality

on:
  merge_group:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js environment
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - name: Install dependencies
        env:
          HUSKY: '0'
        run: npm ci
      # Every step is a package script, the same ones `npm run verify` chains,
      # so the hook and CI cannot drift apart.
      - name: Lint and format
        run: npm run lint
      - name: Docs format and links
        run: npm run docs:check
      - name: Typecheck
        run: npm run typecheck
      - name: Boundary rules
        run: npm run depcruise
      - name: Dead code
        run: npm run knip
      - name: Build
        run: npm run build
      - name: Emit check
        run: npm run check:emit
      - name: Side-effect audit
        run: npm run check:side-effects
      - name: Size budgets
        run: npx size-limit
      - name: Size chart current
        run: npm run check:size-chart
      - name: Package validation
        run: npm run check:package
      - name: Node tests (with coverage)
        run: npm run test:node -- --coverage
      - name: Report Coverage
        if: github.event_name == 'pull_request'
        uses: davelosert/vitest-coverage-report-action@c4bbc33a89b7ace0e63d35f1f7d4bcee31155a73 # v2
      - name: Install browsers
        uses: ./.github/actions/playwright-browsers
      - name: Browser tests
        run: npm run test:browser

  # The app's page in three real browsers, over its sources. Its own job so the
  # verify tiers and the browsers download in parallel; `npm run test:e2e`
  # runs the same suite locally. The build comes first: no other gate on a
  # pull request proves the hosted receiver page still builds.
  app-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js environment
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - name: Install dependencies
        env:
          HUSKY: '0'
        run: npm ci
      - name: Build the app
        run: npm run app:build
      - name: Install browsers
        uses: ./.github/actions/playwright-browsers
      - name: App page E2E
        run: npm run test:e2e

  commitlint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Node.js environment
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - name: Install dependencies
        env:
          HUSKY: '0'
        run: npm ci
      - name: Lint commit messages (Conventional Commits drive releases)
        run: |
          npx commitlint \
            --from "${{ github.event.pull_request.base.sha }}" \
            --to "${{ github.event.pull_request.head.sha }}" --verbose

  size-report:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js environment
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - name: Post size-limit deltas as PR comment
        uses: andresz1/size-limit-action@94bc357df29c36c8f8d50ea497c3e225c3c95d1d # v1.8.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          package_manager: npm
          build_script: build

  # The ruleset on main requires a check named `quality`, and Actions reports
  # per job, so this job is the one name that stands for the whole workflow.
  # commitlint and size-report are skipped outside pull requests, so a skipped
  # dependency counts as passing; only a failure or a cancellation fails it.
  quality:
    needs: [verify, app-e2e, commitlint, size-report]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Check every gate
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
